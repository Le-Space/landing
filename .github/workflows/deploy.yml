name: Build & Deploy to Aleph IPFS

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      domain_local_first:
        description: 'Override domain for the local-first site (empty = local-first.le-space.de on main push)'
        required: false
        default: ''
      domain_le_space:
        description: 'Override domain for the le-space site (empty = le-space.de on main push)'
        required: false
        default: ''

jobs:
  # Bump the patch level once per push to main, before anything is built, so the
  # version baked into the footer is the one this deploy publishes. Runs as its
  # own job rather than inside the matrix — two matrix legs would bump twice and
  # race each other on the push.
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-bump-main
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: bump
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")
          next=$(node -p "
            const [ma, mi, pa] = require('./package.json').version.split('.').map(Number);
            [ma, mi, pa + 1].join('.');
          ")
          for f in package.json sites/local-first/package.json \
                   sites/le-space/package.json packages/shared/package.json; do
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('$f', 'utf8'));
              p.version = '$next';
              fs.writeFileSync('$f', JSON.stringify(p, null, 2) + '\n');
            "
          done
          git add package.json sites/*/package.json packages/*/package.json
          # [skip ci] keeps this push from triggering the workflow again.
          git commit -m "chore(release): $next [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "::notice::version $current → $next"

  build-and-deploy:
    needs: [version]
    # `version` is skipped on pull_request and workflow_dispatch; without always()
    # a skipped dependency would skip this job too.
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel a healthy site's deploy because the other site failed.
      fail-fast: false
      matrix:
        include:
          - site: local-first
            package: '@le-space/site-local-first'
            site_name: le-space-local-first
            domain: local-first.le-space.de
          - site: le-space
            package: '@le-space/site-le-space'
            site_name: le-space-landing
            domain: le-space.de
    steps:
      # Check out the bump commit, not the pushed one, so the build carries the
      # version this run just published.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha || github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.site }}
        env:
          APP_COMMIT: ${{ needs.version.outputs.sha || github.sha }}
        run: pnpm --filter ${{ matrix.package }} build

      # Prerender + JSON-LD. Without this the published artifact's body is only
      # <div id="app"></div>, so every crawler that does not run JavaScript sees
      # an empty page — and IPFS hosting means no origin exists that could render
      # on request. See docs/seo-plan.md.
      - name: Install prerender toolchain
        run: |
          npm install --prefix /tmp/le-space-prerender playwright@1.61.1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/le-space-prerender/browsers \
            /tmp/le-space-prerender/node_modules/.bin/playwright install --with-deps chromium

      - name: Prerender ${{ matrix.site }}
        env:
          PLAYWRIGHT_DIR: /tmp/le-space-prerender/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/le-space-prerender/browsers
        run: node tools/postbuild.mjs ${{ matrix.site }}

      # A silent prerender failure would republish an empty page, which is
      # exactly the state this whole step exists to fix — fail the deploy instead.
      - name: Verify prerendered output
        run: |
          for page in index.html de/index.html; do
            f="sites/${{ matrix.site }}/dist/$page"
            [ -f "$f" ] || { echo "::error::$page missing for ${{ matrix.site }}"; exit 1; }
            if grep -q '<div id="app"></div>' "$f"; then
              echo "::error::prerender produced no content for ${{ matrix.site }}/$page"
              exit 1
            fi
            grep -q 'application/ld+json' "$f" \
              || { echo "::error::JSON-LD missing in ${{ matrix.site }}/$page"; exit 1; }
            grep -q 'hreflang="x-default"' "$f" \
              || { echo "::error::hreflang missing in ${{ matrix.site }}/$page"; exit 1; }
          done
          # Exactly one canonical per page — a duplicate is an outright SEO error.
          for page in index.html de/index.html; do
            n=$(grep -o 'rel="canonical"' "sites/${{ matrix.site }}/dist/$page" | wc -l)
            [ "$n" -eq 1 ] || { echo "::error::$n canonicals in ${{ matrix.site }}/$page"; exit 1; }
          done

      - name: Install isolated Aleph deploy tooling
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm install --prefix /tmp/le-space-deployer @le-space/node@0.6.30

      - name: Publish to Aleph IPFS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: publish
        env:
          ALEPH_VM_MODE: site-publish
          ALEPH_SITE_DIRECTORY: ${{ github.workspace }}/sites/${{ matrix.site }}/dist
          ALEPH_SITE_PIN: 'true'
          ALEPH_SITE_NAME: ${{ matrix.site_name }}
          ALEPH_SITE_CHANNEL: ALEPH-CLOUDSOLUTIONS
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: |
          for attempt in 1 2 3; do
            if node --input-type=module -e "import('/tmp/le-space-deployer/node_modules/@le-space/node/index.js').then((m) => m.runSiteMode())"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Aleph publish attempt $attempt failed; retrying..."
            sleep $((attempt * 15))
          done

      - name: Link custom domain
        # Only link a domain to a CID that was actually published this run.
        if: >-
          steps.publish.outcome == 'success' &&
          steps.publish.outputs.item_hash != '' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'workflow_dispatch'))
        env:
          ALEPH_VM_MODE: site-domain-link
          ALEPH_SITE_ITEM_HASH: ${{ steps.publish.outputs.item_hash }}
          ALEPH_SITE_IPFS_CID: ${{ steps.publish.outputs.ipfs_cid }}
          ALEPH_SITE_IPFS_CID_V0: ${{ steps.publish.outputs.ipfs_cid_v0 }}
          ALEPH_SITE_DOMAIN: ${{ matrix.site == 'local-first' && (inputs.domain_local_first || matrix.domain) || (inputs.domain_le_space || matrix.domain) }}
          ALEPH_SITE_DOMAIN_CATCH_ALL_PATH: /index.html
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: node --input-type=module -e "import('/tmp/le-space-deployer/node_modules/@le-space/node/index.js').then((m) => m.runSiteMode())"
